<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Ma Journée</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header style="padding: 80px 0 40px;">
        <div class="container">
            <a href="index.html">
                <img src="je.png" alt="Je Logo" class="logo-img" onerror="this.style.display='none'" style="width: 60px; margin-bottom: 20px;">
            </a>
            <h1 class="serif page-title">Contact</h1>
            <p class="tagline-ja">お問い合わせ</p>
        </div>
    </header>

    <div class="container">
        <div class="content-wrapper">
            <p>Ma Journéeに関するご質問、ご要望、不具合のご報告などがございましたら、以下のフォームよりお気軽にご連絡ください。<br>
            ※外部サポートサイト（<a href="https://81ko.github.io/ExamenCVQ/support.html" target="_blank" style="color: #000;">Support Page</a>）も併せてご確認ください。</p>
            
            <form action="#" method="POST" style="margin-top: 40px;">
                <div class="form-group">
                    <label for="name">Nom / お名前</label>
                    <input type="text" id="name" name="name" class="form-control" required placeholder="Ex. Sophie Dupont">
                </div>
                
                <div class="form-group">
                    <label for="email">E-mail / メールアドレス</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="adresse@exemple.com">
                </div>
                
                <div class="form-group">
                    <label for="message">Message / メッセージ</label>
                    <textarea id="message" name="message" class="form-control" required placeholder="ご用件をご入力ください..."></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Envoyer / 送信する</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="contact.html">Contact / お問い合わせ</a>
                <a href="privacy.html">Politique de confidentialité / プライバシーポリシー</a>
            </div>
            <p>&copy; 2026 Ma Journée App. Tous droits réservés.</p>
        </div>
    </footer>
</body>
</html>
